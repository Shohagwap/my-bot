<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotex Trading Bot</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0e14;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .bot-card {
            background-color: #151d2a;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            text-align: center;
            border: 1px solid #232d3f;
        }
        .select-box {
            width: 100%;
            padding: 10px;
            background-color: #0b0e14;
            color: #ffffff;
            border: 1px solid #232d3f;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 15px;
            outline: none;
        }
        .timer {
            font-size: 13px;
            color: #8a99ad;
            margin-bottom: 15px;
        }
        .status-box {
            background-color: #0b0e14;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #1c2638;
        }
        .status-label {
            font-size: 11px;
            color: #5d6e85;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
        }
        .signal {
            font-size: 22px;
            font-weight: 800;
            margin: 10px 0;
        }
        .call { color: #22c55e; }
        .put { color: #ef4444; }
        .info {
            font-size: 13px;
            color: #22c55e;
            font-weight: 600;
        }
        .btn {
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        .btn:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>

<div class="bot-card">
    <!-- কারেন্সি সিলেক্ট করার ড্রপডাউন মেনু -->
    <select id="currency-select" class="select-box">
        <option value="AUTO">🔄 Auto (Random Pairs)</option>
        <option value="BRL/USD (OTC)">BRL/USD (OTC)</option>
        <option value="USD/BRL (OTC)">USD/BRL (OTC)</option>
        <option value="USD/MXN (OTC)">USD/MXN (OTC)</option>
        <option value="EUR/USD (OTC)">EUR/USD (OTC)</option>
        <option value="GBP/USD (OTC)">GBP/USD (OTC)</option>
        <option value="USD/NGN (OTC)">USD/NGN (OTC)</option>
        <option value="USD/JPY (OTC)">USD/JPY (OTC)</option>
        <option value="AUD/USD (OTC)">AUD/USD (OTC)</option>
    </select>

    <div class="timer" id="time-display">Next Candle: --:--</div>

    <div class="status-box">
        <div class="status-label" id="status-label">STATUS: READY</div>
        <div class="signal" id="signal-display">PRESS GET SIGNAL</div>
        <div class="info" id="confidence-display">Confidence: --%</div>
    </div>

    <button class="btn" onclick="generateSignal()">GET SIGNAL</button>
</div>

<script>
    const otcPairs = [
        "BRL/USD (OTC)", "USD/BRL (OTC)", "USD/MXN (OTC)", "NZD/CHF (OTC)", 
        "AUD/CHF (OTC)", "USD/NGN (OTC)", "AUD/CAD (OTC)", "AUD/USD (OTC)", 
        "GBP/USD (OTC)", "GBP/AUD (OTC)", "NZD/USD (OTC)", "EUR/GBP (OTC)", 
        "EUR/USD (OTC)", "USD/JPY (OTC)", "GBP/JPY (OTC)"
    ];

    function generateSignal() {
        const selectElement = document.getElementById("currency-select");
        const signalElement = document.getElementById("signal-display");
        const confidenceElement = document.getElementById("confidence-display");
        const timeElement = document.getElementById("time-display");
        const statusLabel = document.getElementById("status-label");

        statusLabel.innerText = "STATUS: SCANNING";
        signalElement.innerText = "SCANNING...";
        signalElement.className = "signal";

        setTimeout(() => {
            let chosenPair = selectElement.value;

            // যদি Auto সিলেক্ট করা থাকে, তবে র্যান্ডম পেয়ার আসবে
            if (chosenPair === "AUTO") {
                chosenPair = otcPairs[Math.floor(Math.random() * otcPairs.length)];
            }

            // সিগন্যাল (CALL/PUT) জেনারেট
            const isCall = Math.random() > 0.5;
            if (isCall) {
                signalElement.innerText = "CALL (UP 🟢)";
                signalElement.className = "signal call";
            } else {
                signalElement.innerText = "PUT (DOWN 🔴)";
                signalElement.className = "signal put";
            }

            // কনফিডেন্স
            const confidence = Math.floor(Math.random() * 17) + 82;
            confidenceElement.innerText = "Confidence: " + confidence + "%";

            // সময়
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            timeElement.innerText = "Entry Time: " + hours + ":" + minutes;
            statusLabel.innerText = "STATUS: ACTIVE (" + chosenPair + ")";

        }, 1000);
    }
</script>

</body>
</html>
