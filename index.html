<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Signal Bot UI</title>
    <style>
        body { background-color: #0d1117; color: #fff; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .bot-box { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 25px; width: 300px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .status-box { background: #010409; border: 1px solid #21262d; border-radius: 8px; padding: 15px; margin: 15px 0; }
        .signal-btn { background: #238636; color: #fff; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .signal-btn:hover { background: #2ea043; }
        #result { color: #2f81f7; font-size: 20px; font-weight: bold; margin: 10px 0; }
        #confidence { color: #7ee787; font-size: 14px; }
        #entry-time { color: #8b949e; font-size: 14px; }
    </style>
</head>
<body>

<div class="bot-box">
    <h3>USD/BDT (OTC)</h3>
    <p>Next Candle: <span id="next-candle-timer">00:00</span></p>

    <div class="status-box">
        <div id="status">STATUS: IDLE</div>
        <div id="result">--</div>
        <small id="confidence">Confidence: --%</small><br>
        <small id="entry-time">Entry Time: --:--</small>
    </div>

    <button class="signal-btn" onclick="getSignal()">GET SIGNAL</button>
</div>

<script>
    function getSignal() {
        const directions = ["CALL (UP 🟢)", "PUT (DOWN 🔴)"];
        const randomDirection = directions[Math.floor(Math.random() * directions.length)];
        const randomConfidence = Math.floor(Math.random() * (95 - 75 + 1)) + 75;
        
        const now = new Date();
        now.setMinutes(now.getMinutes() + 1);
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const entryTime = `${hours}:${minutes}`;

        document.getElementById("status").innerText = "STATUS: ACTIVE";
        document.getElementById("result").innerText = randomDirection;
        document.getElementById("confidence").innerText = "Confidence: " + randomConfidence + "%";
        document.getElementById("entry-time").innerText = "Entry Time: " + entryTime;
    }

    setInterval(() => {
        const now = new Date();
        const seconds = 60 - now.getSeconds();
        const timerText = seconds < 10 ? "00:0" + seconds : "00:" + seconds;
        const timerElem = document.getElementById("next-candle-timer");
        if(timerElem) timerElem.innerText = timerText;
    }, 1000);
</script>

</body>
</html>
