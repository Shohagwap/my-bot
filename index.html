<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotex Trading Bot</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0e14;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .bot-container {
            width: 100%;
            max-width: 360px;
        }
        .select-box {
            width: 100%;
            padding: 12px;
            background-color: #151d2a;
            color: #ffffff;
            border: 1px solid #232d3f;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 15px;
            outline: none;
            cursor: pointer;
        }
        .bot-card {
            background-color: #151d2a;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            text-align: center;
            border: 1px solid #232d3f;
        }
        .pair-title {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 5px;
        }
        .timer {
            font-size: 13px;
            color: #8a99ad;
            margin-bottom: 15px;
        }
        .status-box {
            background-color: #0b0e14;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #1c2638;
        }
        .status-label {
            font-size: 11px;
            color: #5d6e85;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
        }
        .signal {
            font-size: 22px;
            font-weight: 800;
            margin: 10px 0;
        }
        .call { color: #22c55e; }
        .put { color: #ef4444; }
        .info {
            font-size: 13px;
            color: #22c55e;
            font-weight: 600;
        }
        .btn {
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        .btn:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>

<div class="bot-container">
    <!-- স্ক্রিনশটের সব পেয়ার যুক্ত করা ড্রপডাউন মেনু -->
    <select id="currency-select" class="select-box">
        <option value="AUTO">🔄 Auto (Random Pairs)</option>
        <option value="USD/BRL (OTC)">USD/BRL (OTC)</option>
        <option value="USD/MXN (OTC)">USD/MXN (OTC)</option>
        <option value="NZD/CHF (OTC)">NZD/CHF (OTC)</option>
        <option value="AUD/CHF (OTC)">AUD/CHF (OTC)</option>
        <option value="USD/NGN (OTC)">USD/NGN (OTC)</option>
        <option value="AUD/CAD (OTC)">AUD/CAD (OTC)</option>
        <option value="AUD/USD (OTC)">AUD/USD (OTC)</option>
        <option value="GBP/USD (OTC)">GBP/USD (OTC)</option>
        <option value="GBP/AUD (OTC)">GBP/AUD (OTC)</option>
        <option value="NZD/USD (OTC)">NZD/USD (OTC)</option>
        <option value="EUR/GBP (OTC)">EUR/GBP (OTC)</option>
        <option value="NZD/CAD (OTC)">NZD/CAD (OTC)</option>
        <option value="USD/DZD (OTC)">USD/DZD (OTC)</option>
        <option value="AUD/NZD (OTC)">AUD/NZD (OTC)</option>
        <option value="GBP/JPY (OTC)">GBP/JPY (OTC)</option>
        <option value="CHF/JPY (OTC)">CHF/JPY (OTC)</option>
        <option value="EUR/CHF (OTC)">EUR/CHF (OTC)</option>
        <option value="EUR/JPY (OTC)">EUR/JPY (OTC)</option>
        <option value="USD/CHF (OTC)">USD/CHF (OTC)</option>
        <option value="USD/IDR (OTC)">USD/IDR (OTC)</option>
        <option value="USD/PHP (OTC)">USD/PHP (OTC)</option>
        <option value="USD/ZAR (OTC)">USD/ZAR (OTC)</option>
        <option value="AUD/JPY (OTC)">AUD/JPY (OTC)</option>
        <option value="CAD/CHF (OTC)">CAD/CHF (OTC)</option>
        <option value="EUR/AUD (OTC)">EUR/AUD (OTC)</option>
        <option value="EUR/USD (OTC)">EUR/USD (OTC)</option>
        <option value="NZD/JPY (OTC)">NZD/JPY (OTC)</option>
        <option value="USD/ARS (OTC)">USD/ARS (OTC)</option>
        <option value="USD/COP (OTC)">USD/COP (OTC)</option>
        <option value="USD/EGP (OTC)">USD/EGP (OTC)</option>
        <option value="USD/JPY (OTC)">USD/JPY (OTC)</option>
        <option value="USD/PKR (OTC)">USD/PKR (OTC)</option>
        <option value="GBP/NZD (OTC)">GBP/NZD (OTC)</option>
        <option value="EUR/NZD (OTC)">EUR/NZD (OTC)</option>
        <option value="GBP/CAD (OTC)">GBP/CAD (OTC)</option>
    </select>

    <div class="bot-card">
        <div class="pair-title" id="pair-display">USD/BRL (OTC)</div>
        <div class="timer" id="time-display">Entry Time: --:--</div>

        <div class="status-box">
            <div class="status-label" id="status-label">STATUS: READY</div>
            <div class="signal" id="signal-display">PRESS GET SIGNAL</div>
            <div class="info" id="confidence-display">Confidence: --%</div>
        </div>

        <button class="btn" onclick="generateSignal()">GET SIGNAL</button>
    </div>
</div>

<script>
    const otcPairs = [
        "USD/BRL (OTC)", "USD/MXN (OTC)", "NZD/CHF (OTC)", "AUD/CHF (OTC)", 
        "USD/NGN (OTC)", "AUD/CAD (OTC)", "AUD/USD (OTC)", "GBP/USD (OTC)", 
        "GBP/AUD (OTC)", "NZD/USD (OTC)", "EUR/GBP (OTC)", "NZD/CAD (OTC)", 
        "USD/DZD (OTC)", "AUD/NZD (OTC)", "GBP/JPY (OTC)", "CHF/JPY (OTC)", 
        "EUR/CHF (OTC)", "EUR/JPY (OTC)", "USD/CHF (OTC)", "USD/IDR (OTC)", 
        "USD/PHP (OTC)", "USD/ZAR (OTC)", "AUD/JPY (OTC)", "CAD/CHF (OTC)", 
        "EUR/AUD (OTC)", "EUR/USD (OTC)", "NZD/JPY (OTC)", "USD/ARS (OTC)", 
        "USD/COP (OTC)", "USD/EGP (OTC)", "USD/JPY (OTC)", "USD/PKR (OTC)", 
        "GBP/NZD (OTC)", "EUR/NZD (OTC)", "GBP/CAD (OTC)"
    ];

    function generateSignal() {
        const selectElement = document.getElementById("currency-select");
        const pairElement = document.getElementById("pair-display");
        const signalElement = document.getElementById("signal-display");
        const confidenceElement = document.getElementById("confidence-display");
        const timeElement = document.getElementById("time-display");
        const statusLabel = document.getElementById("status-label");

        statusLabel.innerText = "STATUS: SCANNING";
        signalElement.innerText = "SCANNING...";
        signalElement.className = "signal";

        setTimeout(() => {
            let chosenPair = selectElement.value;

            if (chosenPair === "AUTO") {
                chosenPair = otcPairs[Math.floor(Math.random() * otcPairs.length)];
            }
            
            pairElement.innerText = chosenPair;

            const isCall = Math.random() > 0.5;
            if (isCall) {
                signalElement.innerText = "CALL (UP 🟢)";
                signalElement.className = "signal call";
            } else {
                signalElement.innerText = "PUT (DOWN 🔴)";
                signalElement.className = "signal put";
            }

            const confidence = Math.floor(Math.random() * 17) + 82;
            confidenceElement.innerText = "Confidence: " + confidence + "%";

            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            timeElement.innerText = "Entry Time: " + hours + ":" + minutes;
            statusLabel.innerText = "STATUS: ACTIVE";

        }, 1000);
    }
</script>

</body>
</html>
